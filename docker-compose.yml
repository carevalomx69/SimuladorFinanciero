version: '3.8'

services:
  # 1. SERVIDOR WEB (PHP + Apache + WebSocket, vía Supervisor)
  web:
    build: .
    container_name: apache_calculadora
    restart: unless-stopped
    ports:
      # Remapeados: la instancia Oracle ya tiene el 80 (Nginx de Estructuras_de_datos_UAA)
      # y el 8080 (Adminer) ocupados por el otro proyecto. Puerto host : puerto contenedor.
      - "8082:80"
      - "8083:8081"
    volumes:
      # Sincronización de carpetas de código (para desarrollo en vivo)
      - ./api:/var/www/html/api
      - ./js:/var/www/html/js
      - ./style:/var/www/html/style
      - ./bin:/var/www/html/bin
      - ./index.html:/var/www/html/index.html
      # Volumen para vendor/ (Ratchet), se inicializa desde la imagen la primera vez
      - vendor-data:/var/www/html/vendor
    networks:
      - mi_red
    depends_on:
      - db

  # 2. BASE DE DATOS (MySQL 8, reemplaza a Oracle XE)
  db:
    image: mysql:8.0
    container_name: mysql_calculadora
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_admin1234
      MYSQL_DATABASE: analisis_financiero_db
      MYSQL_USER: usuario_finanzas
      MYSQL_PASSWORD: admin1234
    ports:
      # Remapeado: el 3306 del host ya lo usa la base del otro proyecto en
      # esta misma instancia. La app se conecta por red interna de Docker
      # (host "db" dentro del compose), así que esto solo es para poder
      # inspeccionar la base desde afuera con un cliente MySQL o Adminer.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Todo .sql en esta carpeta se ejecuta automáticamente la PRIMERA VEZ
      # que se crea el volumen (así se crean las tablas + usuarios solitas).
      # OJO: el nombre 'Bd' debe coincidir EXACTO con tu carpeta (Linux distingue mayúsculas/minúsculas).
      - ./Bd:/docker-entrypoint-initdb.d
    networks:
      - mi_red
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_admin1234"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  vendor-data:

networks:
  mi_red:
    driver: bridge